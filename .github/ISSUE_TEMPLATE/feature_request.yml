name: ✨ 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎分享你的想法！ / We'd love to hear your ideas!

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你想解决什么痛点？ / What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered

  - type: checkboxes
    id: willing
    attributes:
      label: 贡献意愿 / Contribution
      options:
        - label: 我愿意提交 PR 实现此功能 / I'm willing to submit a PR for this
