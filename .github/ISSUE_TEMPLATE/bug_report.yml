name: 🐛 Bug 报告 / Bug Report
description: 报告一个问题帮助我们改进 / Report a problem to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索是否已有类似 issue。 / Thanks for taking the time — please search existing issues first.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰简洁地描述问题 / A clear description of what happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to Reproduce
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 浏览器控制台或服务端日志（注意移除 API Key 等敏感信息）
      render: shell

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式 / Deployment
      options:
        - "npm run dev (本地开发)"
        - "Docker / docker-compose"
        - "其他 / Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: "v1.0.0 / commit hash"
